services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    # Optional: an override file is honored when present, but the app runs on defaults without one.
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_DOCKER_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
