services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8011}:8000"
    volumes:
      - ./data:/data
    # Optional: an override file is honored when present, but the app runs on defaults without one.
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # What the image's command binds, stated so the app can report it.
      BACKEND_HOST: 0.0.0.0
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_DOCKER_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
