services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/fintrack-data.db
      CONTROL_DB_PATH: /data/fintrack-control.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_DOCKER_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
