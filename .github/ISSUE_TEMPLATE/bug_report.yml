name: Bug report
description: Something in Luma behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not include real financial data** — no account numbers, no institution names, no
        exported CSV rows from a real account. If a sample file is needed to reproduce the problem,
        replace the values with invented ones first.

        For a **security vulnerability**, do not open an issue — see
        [SECURITY.md](../blob/main/SECURITY.md) for private reporting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What was expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a CSV with …
        2. Open the Transactions page and …
        3. The category column shows …
    validations:
      required: true

  - type: textarea
    id: installation
    attributes:
      label: Installation details
      description: |
        In Luma, **Settings → About → Copy details**, then paste here. It holds the version, how Luma is
        running and on what system, and nothing identifying. If Luma does not start, give the version, how
        it was installed and the operating system instead.
      render: text
    validations:
      required: true

  - type: dropdown
    id: data-source
    attributes:
      label: Where did the affected data come from?
      options:
        - CSV import
        - A connected provider (Plaid)
        - A connected provider (SimpleFIN)
        - A marketplace importer (Amazon / PayPal)
        - Demo data
        - Not data-specific
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Errors from the console or backend log
      description: Browser devtools console and/or the backend output. Redact anything identifying.
      render: text
    validations:
      required: false
