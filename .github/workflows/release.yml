# Builds the downloadable artifacts for a tagged release.
#
# The shape follows from one constraint: PyInstaller cannot cross-build, so each platform's executable
# has to be produced on that platform. That is why this is a matrix of near-identical jobs rather than
# one job with a loop, and why the artifacts are uploaded separately and collected afterwards.
#
# Three deliberate omissions:
#
# - **No tagging.** `scripts/release.py` does not tag either. A person decides what a release is; this
#   workflow reacts to that decision rather than making it.
# - **No publishing.** The jobs upload build artifacts, they do not create a GitHub Release. Publishing
#   is outward-facing and belongs to whoever is cutting the release, who can attach these files to a
#   release they write themselves.
# - **No signing.** The macOS artifacts are unsigned and unnotarized, so Gatekeeper refuses them until
#   the user allows them explicitly. The README inside the disk image says how; certificates are a
#   recurring cost and a separate decision from being able to build.
#
# Linux builds both architectures too, both on **Ubuntu 24.04, named rather than `-latest`**.
# PyInstaller does not bundle glibc — the artifact links against whatever the build machine has — so the
# runner's glibc becomes the *floor* every target machine must meet. 24.04 carries glibc 2.39, and the
# failure on anything older is a link error at launch rather than anything the build notices: the 0.3.0
# x64 kit, built on `ubuntu-latest`, would not start on Ubuntu 22.04 under WSL. 2.39 clears Ubuntu
# 24.04, Debian 13 and Raspberry Pi OS trixie; it leaves out Debian 12 and Raspberry Pi OS bookworm,
# which the 22.04 images covered until GitHub scheduled them for retirement (April 2027). The labels are
# pinned so the floor cannot rise with an image alias. 64-bit only: a 32-bit Pi OS is a different
# architecture again and is not built.
#
# macOS builds both architectures. `macos-13`, the last Intel image under that name, was retired in
# December 2025; `macos-15-intel` replaces it and is the last x86_64 image GitHub plans to offer, until
# roughly August 2027. Two images rather than one universal2 binary, because universal2 would need
# universal2 wheels for `cryptography` and `pydantic-core` and those are not dependably published. The
# Intel kit is built on every tag but not attached to releases, since nobody has tested it on an Intel
# Mac (`docs/releasing.md` → *macOS specifics*).
#
# A manual run can build a single platform instead of all five, which is for testing an artifact on a
# machine that is in front of somebody — the Intel Mac above all, which is otherwise only ever built
# blind. That is why the matrix comes from the `plan` job rather than being written out here: a
# job-level `if` cannot see the `matrix` context, and filtering an `os` dimension while leaving
# `include` in place re-adds the very platforms it excluded, because an include entry that cannot merge
# into a remaining combination is appended as a new one instead. A tag push carries no inputs, so a
# release always builds everything.
#
# Tests gate the build rather than living inside `release.py`, which checks packaging rather than
# correctness on purpose. This is the CI half of that split: nothing gets packaged from code whose
# tests fail. The checks themselves are `ci.yml`, called from here so that a release and an ordinary
# push are gated on one definition instead of two.
#
# The build jobs then smoke-test what they produced, because the failures packaging introduces are ones
# no unit test can reach: a bundled resource that did not make it in, or an app that starts normally
# while writing its databases somewhere nobody looks. `scripts/smoke_artifact.py` launches the artifact
# and asserts where its data landed.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build. A tagged release always builds all five.
        type: choice
        default: all
        options:
          - all
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest
          - macos-latest
          - macos-15-intel

jobs:
  # The gate itself lives in `ci.yml` and is called rather than copied. A release has to pass exactly
  # what a push passes, and a second transcription of the same checks is the one that drifts — silently,
  # and in the workflow nobody reads until a build has already shipped.
  test:
    name: Tests and lint
    uses: ./.github/workflows/ci.yml

  plan:
    name: Choose platforms
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      # No checkout: the platform table is the whole of this job, and reading it from the workflow that
      # is already running is one fewer thing that can be out of step with it.
      - id: pick
        shell: python
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          import json
          import os

          # `form` is the distribution form each platform ships, and therefore the one its artifact is
          # smoke-tested as. macOS is installed-only: a `.app` cannot hold its own writable data.
          #
          # `slug` is what the upload is named, and it exists because the runner label is a poor name for
          # something a person downloads. The labels describe build infrastructure rather than targets:
          # `ubuntu-24.04` does not say x64, `macos-latest` and `macos-15-intel` are an arm64 and an x64
          # build named by image vintage, and the "latest" in two of them reads as a version while meaning
          # only that the image alias floats. The slugs are the `<system>-<arch>` vocabulary
          # `build_desktop.py::_platform_tag` already stamps into the archive inside, so the wrapper and
          # its contents agree.
          targets = [
              {"os": "ubuntu-24.04", "slug": "linux-x64", "form": "portable"},
              {"os": "ubuntu-24.04-arm", "slug": "linux-arm64", "form": "portable"},
              {"os": "windows-latest", "slug": "windows-x64", "form": "portable"},
              {"os": "macos-latest", "slug": "macos-arm64", "form": "installed"},
              {"os": "macos-15-intel", "slug": "macos-x64", "form": "installed"},
          ]

          # A tag push carries no inputs at all, which is what makes a release build the whole set
          # without the release path having to say so.
          wanted = os.environ.get("PLATFORM") or "all"
          if wanted != "all":
              targets = [target for target in targets if target["os"] == wanted]
              # Reachable only if the choice list above and this table have drifted apart, which would
              # otherwise present as a build that silently produced nothing.
              if not targets:
                  raise SystemExit(f"No such platform: {wanted}")

          print("Building: " + ", ".join(target["os"] for target in targets))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"targets={json.dumps(targets)}\n")

  build:
    # Named for the target rather than the runner, with the runner label kept alongside it: the slug is
    # what someone scanning a run is looking for, and the label is the first thing worth knowing when one
    # platform alone fails — a glibc floor, a retired image, an arm-only packaging problem — which is
    # visible here without opening the job.
    name: Build ${{ matrix.slug }} (${{ matrix.os }})
    needs: [test, plan]
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the others — a partial set of artifacts is still worth
      # having while the broken platform is investigated.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}

    steps:
      # Full history, not the default shallow fetch: `scripts/build_stamp.py` stamps the artifact with
      # `git describe`, and that needs both the tags and the commits between the newest one and HEAD to
      # count the distance. `fetch-tags` alone is not enough — with a depth-1 clone the tag is present
      # but unreachable from HEAD, and describe falls back to the bare revision. The failure is silent
      # either way: a stamp that reads `a1b2c3d` instead of `v0.3.0-14-ga1b2c3d` still builds.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # cryptography publishes no Intel Mac wheel, so pip builds it from source there, and by default that
      # links Homebrew's OpenSSL as shared libraries. Those carry the same file names as the OpenSSL built
      # into the python.org framework, PyInstaller keeps one copy of each name, and the kit ends up with
      # one half of each OpenSSL — which cryptography fails to load. Linking it statically is how
      # cryptography's own wheels are built on every other platform.
      - name: Link cryptography's source build statically
        if: matrix.slug == 'macos-x64'
        run: |
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt

      # A wheel built earlier with OpenSSL linked as shared libraries would be reused from pip's cache
      # whatever the environment now says, and would bring the conflict back.
      - name: Check cryptography carries its own OpenSSL
        if: matrix.slug == 'macos-x64'
        run: |
          module=$(python -c "import cryptography.hazmat.bindings._rust as m; print(m.__file__)")
          if otool -L "$module" | grep -E 'lib(ssl|crypto)\.'; then
            echo "cryptography links OpenSSL as shared libraries; it has to be linked statically." >&2
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Built as its own step so a bundling failure is distinguishable from a packaging one in the log.
      # `build_desktop.py` can do this itself, but that path exists for a fresh clone rather than here.
      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      # `release.py` gates on the version declarations agreeing and on a clean working tree, then packages
      # and writes the checksum. A fresh checkout satisfies the tree gate, and everything the build writes
      # is gitignored, so it cannot dirty the tree mid-run.
      - name: Package release artifact
        run: python scripts/release.py --skip-frontend

      - name: Smoke test the artifact
        run: python scripts/smoke_artifact.py --form ${{ matrix.form }}

      # The installed form has no installer on this platform and is not shipped from here — it is built
      # only to prove the mechanism macOS will depend on entirely. The per-OS data directory and the
      # build-time signal that selects it are unit-tested by faking `sys.platform`, but only a real
      # artifact can show the declaration survived the build and the frozen binary read it back. Proving
      # that on the cheapest runner means macOS is not the first place it is ever exercised. Keyed on the
      # target rather than the runner label, so moving the build to another image cannot silently skip it.
      - name: Smoke test the installed form
        if: matrix.slug == 'linux-x64'
        run: |
          python scripts/build_desktop.py --skip-frontend --form installed
          python scripts/smoke_artifact.py --form installed

      - uses: actions/upload-artifact@v7
        with:
          name: luma-${{ matrix.slug }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.sha256
            !dist/*-installed.*
          if-no-files-found: error
