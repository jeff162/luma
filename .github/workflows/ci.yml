# The gate that runs on every push and pull request, and the same gate a release runs before it
# packages anything.
#
# **One file rather than two.** `release.yml` calls this workflow instead of restating the checks. A
# release gated on a *copy* of the checks drifts from them silently, and the copy that decides whether
# a build ships is the worst one to let drift.
#
# **Two main jobs, in parallel.** The unit lane needs no browser; the browser lane spends most of its
# wall clock installing Chromium and booting two servers. Splitting them pays the setup twice and gets
# the slower half started at minute zero rather than after the faster half finishes. A third, small job
# runs the backend suite alone on the newest Python a source checkout is said to work on.
#
# **Why the browser lane is here at all.** It covers what nothing else does: the specs drive the app as
# a user meets it — the dev server, a real backend against a throwaway database, a real DOM — so a
# screen that no longer renders fails here and passes everywhere else. Keeping Playwright out of CI was
# the earlier call, made when the suite was slow and stale. It is now part of the local gate
# (`npm run check`), and a suite that gates the developer but not the merge is one that only ever
# blocks the person who already ran it.
#
# The **production-bundle smoke pass** (`npm run ui:smoke`) is still deliberately outside this. It
# answers a different question — does the *built* bundle load — and its trigger is a build or runtime
# dependency change and the release cut, not every push. `playwright.smoke.config.js` says so at
# length.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Three pushes in a minute need the answer for the third, not for all three — but a release's gate is
# not a superseded push, and cancelling one throws away a build nobody can get back without starting over.
#
# Telling the two apart cannot be done by asking whether this workflow was *called*: inside a called
# workflow the whole `github` context belongs to the caller, so `github.event_name` is the caller's event
# (`push`, `workflow_dispatch`) and never `workflow_call`, and `github.workflow` is the caller's name.
# What does work is that this workflow's own triggers are a push to `main` and a pull request — so a
# `workflow_dispatch` or a tag ref arriving here can only be `release.yml` calling in. Those get a group
# of their own per run (`github.run_id` is the caller's, one per release), which is what stopped two
# manual release builds from cancelling each other: both evaluated to one group under the caller's ref.
#
# `cancel-in-progress` stays plain `true` because a group carrying the run id is unique — there is never
# anything in it to cancel.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && format('release-ci-{0}', github.run_id) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Backend, unit and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # requirements-dev.txt carries ruff, which the lint step below runs. It is a separate file from
      # the test extra on purpose, so a lane that only needs pytest does not install a linter.
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # `-n auto` matches the local runner (scripts/run_tests.sh): one xdist worker per core, which on a
      # hosted runner is a smaller win than on a workstation but still a win, and keeps the two paths
      # running the suite the same way.
      - name: Backend tests
        run: python -m pytest backend/tests -n auto

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      # Covers eslint, the frontend comment check, the backend comment check, ruff, the timestamp check
      # and the personal-data check. The Python-backed ones find their own interpreter, which the step
      # above has already put on PATH.
      - name: Lint
        working-directory: frontend
        run: npm run lint

  # Everything else here runs on 3.12, which is what the packaged downloads carry. A source checkout
  # runs on whatever Python its machine has, and a distribution whose only Python is newer is exactly
  # where a pin without wheels for it fails — at install, before a single test. Backend only: nothing in
  # the frontend lanes depends on the interpreter.
  backend-newest-python:
    name: Backend on Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Backend tests
        run: python -m pytest backend/tests -n auto

  browser:
    name: Browser suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The suite boots a real backend (scripts/run-e2e-backend.sh), so this lane needs the runtime
      # requirements even though it runs no Python test. Not the test requirements: nothing here imports
      # pytest, and installing it would only slow the lane down.
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Keyed on the lockfile because that is what pins `@playwright/test`, and a browser build is only
      # valid for the release that fetched it. Chromium alone — the config declares no other browser,
      # and the suite is here to catch a broken screen rather than a rendering difference between
      # engines.
      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # Run on a cache hit too: the binary is cached, the system libraries it links against are not, and
      # they are installed into the runner rather than into that directory.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # All four projects, chained as the config declares: `app` reads the seeded demo ledger, a setup
      # spec clears it, then `import` and `a11y` run against the empty tenant. CI runs the whole set
      # where `npm run check` runs the first three — the a11y sweep is the slowest lane and the one
      # least likely to be broken by an ordinary change, so it earns its place here rather than in the
      # loop a developer runs on every edit.
      - name: Browser suite
        working-directory: frontend
        run: npm run ui:test:all

      # The report is the entire diagnostic for a failure that will not reproduce locally: the config
      # retains a trace, a screenshot and a video on failure, and the HTML report carries all three.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
