<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma</title>
    <!-- Generated from assets/luma-icon.svg by scripts/build_icons.py. The SVG is preferred wherever it
         is understood, since it stays crisp on any display; the .ico is the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Theme is driven entirely by these CSS custom properties. `:root` holds the dark theme
      (the default, used for data-theme="dark" and when no attr is set); [data-theme="light"]
      reassigns the same vars. Semantic color across the app must reference these vars rather
      than copying a literal, so it flips with the theme; decorative palettes (tag/category/
      chart series) are the deliberate exception. See src/lib/theme.js and the inline script
      below.
    -->
    <script>
      // Anti-FOUC: set the theme and display size on <html> before first paint, ahead of the bundle.
      // Preferences round-trip from the backend, so we cannot wait for them here; src/lib/theme.js and
      // src/lib/displaySize.js mirror each choice into a localStorage cache on every change to keep the
      // next load correct.
      (function () {
        try {
          var t = localStorage.getItem('luma.theme') || 'system'
          // Explicit palettes apply directly; 'system' (or anything unknown) resolves to the OS scheme.
          // Keep this palette list in sync with THEMES in src/lib/theme.js.
          var explicit = t === 'light' || t === 'soft' || t === 'dim' || t === 'dark'
          var eff = explicit ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', eff)
        } catch (e) { /* private mode / no matchMedia: fall through to the dark default */ }
        try {
          // Display size, mirrored by src/lib/displaySize.js; keep this list in sync with its choices.
          var size = Number(localStorage.getItem('luma.displaySize'))
          if (size === 80 || size === 90 || size === 110 || size === 125) {
            document.documentElement.style.setProperty('--ui-scale', String(size / 100))
          }
        } catch (e) { /* private mode: full size */ }
      })()
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* The shared Button (components/ui.jsx) looks pressed while it is held. Its styles are inline, and an
         inline style cannot express :active, so this is the one place that state can live. */
      .ui-button:not(:disabled):active { transform: translateY(1px); filter: brightness(0.9); }
      /* Button's padding per size (components/ui.jsx). Where the browser supports it, the label's text box
         is trimmed to the capitals and the baseline, so the capitals sit in the true middle whatever the
         system font, and the padding grows by what the trim removed to keep each size's height. */
      .ui-button-regular { padding: 6px 12px; }
      .ui-button-compact { padding: 3px 9px; }
      @supports (text-box: trim-both cap alphabetic) {
        .ui-button-trim { text-box: trim-both cap alphabetic; }
        .ui-button-trim.ui-button-regular { padding-block: 9px; }
        .ui-button-trim.ui-button-compact { padding-block: 6px; }
      }
      /* IconButton is bare until hovered. Its inline style leaves the background unset except while
         pressed, so this hover fill shows and a pressed toggle keeps its own. */
      .ui-icon-button { background: transparent; }
      .ui-icon-button:not(:disabled):hover { background: color-mix(in srgb, currentColor 14%, transparent); }
      /* IconButton's padding per size. A finger lands less precisely than a pointer, so on a touch screen
         the sides widen and icons sitting side by side in a row stop sharing their edges; only the sides,
         so no row grows taller. */
      .ui-icon-button-regular { padding: 3px 6px; }
      .ui-icon-button-compact { padding: 1px 4px; }
      .ui-icon-button-large { padding: 0 5px; }
      @media (pointer: coarse) {
        .ui-icon-button-regular { padding-inline: 9px; }
        .ui-icon-button-compact { padding-inline: 8px; }
      }
      /* Press-and-hold opens a right-click menu on a touch screen (lib/touchContextMenu.js), so a hold
         must not also start a text selection or Safari's callout. Text is unselectable app-wide there;
         fields keep selection, which Safari otherwise inherits away and leaves them untypeable, and
         `ui-selectable` marks text that is there to be read and copied. */
      @media (pointer: coarse) {
        body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        :is(input, textarea, [contenteditable]), .ui-selectable {
          -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
        }
      }
      .ui-link-button:not(:disabled):hover { text-decoration: underline; }
      /* A clickable pill's outline darkens toward its text colour under the pointer, so a pill that does
         something stands apart from one that only labels. Every pill sets its border inline, which only
         !important can override. Where a child draws the pill, the button is `ui-pill-host` and the child
         `ui-pill-face`. */
      .ui-pill:not(:disabled):hover,
      .ui-pill-host:not(:disabled):hover > .ui-pill-face {
        border-color: color-mix(in srgb, currentColor 60%, transparent) !important;
      }
      /* A browser draws button labels in its own control font rather than the page's. */
      button { font-family: inherit; }
      /* A Button's progress fill. Tinted from the label colour so it reads on every variant; the width eases
         between polls so the bar advances rather than jumping. */
      .ui-button-progress {
        position: absolute; left: 0; top: 0; bottom: 0; pointer-events: none;
        background: color-mix(in srgb, currentColor 24%, transparent);
        transition: width 0.4s linear;
      }
      /* SearchInput (components/ui.jsx) draws its own clear ×, so the browser's is hidden — a pseudo-element
         no inline style can reach. appearance: none stops Safari's search-field styling overriding the inline
         padding and radius. */
      .ui-search-input { -webkit-appearance: none; appearance: none; }
      .ui-search-input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
      /* recharts makes a chart and the layers inside it focusable, so a chart can be read from the keyboard,
         and a browser rings any focused SVG element — one focused by a click included. Keyboard focus keeps
         its ring; a click leaves none. */
      .recharts-wrapper :focus:not(:focus-visible) { outline: none; }
      /* RefreshButton's icon. A turn ends at an iteration boundary, so under reduced motion the animation
         still has to iterate — it pulses in place instead of turning. Spinner's ring (components/ui.jsx)
         shares the keyframes and does the same. */
      @keyframes ui-refresh-turn { to { transform: rotate(360deg); } }
      @keyframes ui-refresh-pulse { 50% { opacity: 0.35; } }
      .ui-refresh-icon { display: block; }
      .ui-refresh-icon.is-spinning { animation: ui-refresh-turn 0.6s linear infinite; }
      .ui-spinner-ring {
        width: 14px; height: 14px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%;
        border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: var(--accent);
        animation: ui-refresh-turn 0.8s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .ui-button:not(:disabled):active { transform: none; }
        .ui-button-progress { transition: none; }
        .ui-refresh-icon.is-spinning { animation-name: ui-refresh-pulse; }
        .ui-spinner-ring { animation: ui-refresh-pulse 1.4s ease-in-out infinite; }
      }
      :root {
        --bg:       #0f1117;
        --surface:  #1a1d27;
        --surface2: #22263a;
        --border:   #2e3248;
        --text:     #e2e8f0;
        --muted:    #8892a4;
        --accent:   #6366f1;
        --accent2:  #818cf8;
        --success:  #22c55e;
        --danger:   #ef4444;
        --warning:  #f59e0b;
        /* "Needs review" row marker — a muted gold, distinct from --warning's orange so it reads
           as "look these over" not "error". Per-theme so it stays legible on light surfaces. A
           future Settings → Appearance swatch will override this per user; it's a variable now so
           that stays a drop-in. */
        --review-marker-color: #e3b341;
        /* A categorical palette for charts that colour a series by what it is (net worth by account
           type), in its fixed order. Checked for colour-blind separation and contrast against these
           surfaces; the light themes step each hue for a light surface rather than reusing these. */
        --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
        --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      [data-theme="light"] {
        --bg:       #f4f6f9;
        --surface:  #ffffff;
        --surface2: #eef1f6;
        --border:   #d6dbe4;
        --text:     #1a1d27;
        --muted:    #5b6678;
        --accent:   #4f46e5;
        --accent2:  #6366f1;
        --success:  #16a34a;
        --danger:   #dc2626;
        --warning:  #d97706;
        --review-marker-color: #b8860b;
        --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
        --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
        color-scheme: light;
      }
      /* Soft light: a muted-grey, lower-glare member of the light family (no bright-white surfaces). */
      [data-theme="soft"] {
        --bg:       #dde1e8;
        --surface:  #eef0f4;
        --surface2: #e3e6ec;
        --border:   #c4cad4;
        --text:     #232733;
        --muted:    #5b6678;
        --accent:   #4f46e5;
        --accent2:  #6366f1;
        --success:  #16a34a;
        --danger:   #dc2626;
        --warning:  #d97706;
        --review-marker-color: #b8860b;
        --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
        --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
        color-scheme: light;
      }
      /* Dim: a soft-charcoal, lower-contrast member of the dark family (grey page, not near-black). */
      [data-theme="dim"] {
        --bg:       #1c1f26;
        --surface:  #252934;
        --surface2: #2e3340;
        --border:   #3a4050;
        --text:     #d6dbe4;
        --muted:    #8b94a6;
        --accent:   #818cf8;
        --accent2:  #a5b4fc;
        --success:  #34d399;
        --danger:   #f87171;
        --warning:  #fbbf24;
        --review-marker-color: #e3c168;
        color-scheme: dark;
      }
      /* Display size (src/lib/displaySize.js). Viewport units shrink with the zoom, hence the division. */
      html { zoom: var(--ui-scale, 1); }
      body { background: var(--bg); color: var(--text); min-height: calc(100vh / var(--ui-scale, 1)); }
      #root { display: flex; flex-direction: column; min-height: calc(100vh / var(--ui-scale, 1)); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
