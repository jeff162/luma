<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack</title>
    <!--
      Theme is driven entirely by these CSS custom properties. `:root` holds the dark theme
      (the default, used for data-theme="dark" and when no attr is set); [data-theme="light"]
      reassigns the same vars. Semantic color across the app must reference these vars rather
      than copying a literal, so it flips with the theme; decorative palettes (tag/category/
      chart series) are the deliberate exception. See src/lib/theme.js and the inline script
      below.
    -->
    <script>
      // Anti-FOUC: set the theme on <html> before first paint, ahead of the bundle. Preferences
      // round-trip from the backend, so we cannot wait for them here; src/lib/theme.js mirrors the
      // resolved choice into this localStorage cache on every change to keep the next load correct.
      (function () {
        try {
          var t = localStorage.getItem('fintrack.theme') || 'system'
          // Explicit palettes apply directly; 'system' (or anything unknown) resolves to the OS scheme.
          // Keep this palette list in sync with THEMES in src/lib/theme.js.
          var explicit = t === 'light' || t === 'soft' || t === 'dim' || t === 'dark'
          var eff = explicit ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', eff)
        } catch (e) { /* private mode / no matchMedia: fall through to the dark default */ }
      })()
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg:       #0f1117;
        --surface:  #1a1d27;
        --surface2: #22263a;
        --border:   #2e3248;
        --text:     #e2e8f0;
        --muted:    #8892a4;
        --accent:   #6366f1;
        --accent2:  #818cf8;
        --success:  #22c55e;
        --danger:   #ef4444;
        --warning:  #f59e0b;
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      [data-theme="light"] {
        --bg:       #f4f6f9;
        --surface:  #ffffff;
        --surface2: #eef1f6;
        --border:   #d6dbe4;
        --text:     #1a1d27;
        --muted:    #5b6678;
        --accent:   #4f46e5;
        --accent2:  #6366f1;
        --success:  #16a34a;
        --danger:   #dc2626;
        --warning:  #d97706;
        color-scheme: light;
      }
      /* Soft light: a muted-grey, lower-glare member of the light family (no bright-white surfaces). */
      [data-theme="soft"] {
        --bg:       #dde1e8;
        --surface:  #eef0f4;
        --surface2: #e3e6ec;
        --border:   #c4cad4;
        --text:     #232733;
        --muted:    #5b6678;
        --accent:   #4f46e5;
        --accent2:  #6366f1;
        --success:  #16a34a;
        --danger:   #dc2626;
        --warning:  #d97706;
        color-scheme: light;
      }
      /* Dim: a soft-charcoal, lower-contrast member of the dark family (grey page, not near-black). */
      [data-theme="dim"] {
        --bg:       #1c1f26;
        --surface:  #252934;
        --surface2: #2e3340;
        --border:   #3a4050;
        --text:     #d6dbe4;
        --muted:    #8b94a6;
        --accent:   #818cf8;
        --accent2:  #a5b4fc;
        --success:  #34d399;
        --danger:   #f87171;
        --warning:  #fbbf24;
        color-scheme: dark;
      }
      body { background: var(--bg); color: var(--text); min-height: 100vh; }
      #root { display: flex; flex-direction: column; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
