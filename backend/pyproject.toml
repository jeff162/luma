[project]
name = "luma"
version = "0.3.0"
description = "Self-hosted personal finance tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "plaid-python==45.0.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    # Its wheels vendor OpenSSL, so this pin decides which OpenSSL every packaged kit ships with.
    "cryptography==50.0.2",
    # WebAuthn verification for passkey sign-in; the vault's passkeys verify no assertion and do not
    # use it.
    "webauthn==3.0.1",
    # Verifies TLS against the OS certificate store rather than a CA bundle pinned here — a
    # runtime dependency because a frozen build has no CA file on disk at all.
    "truststore==0.10.5",
    "segno==1.6.6",
    "Pillow==12.3.0",
    "pypdf==6.20.1",
    # The mDNS responder behind a server-mode installation's network name.
    "zeroconf==0.151.5",
    # The notification-area icon of a Windows server started without a console.
    'pystray==0.19.5; sys_platform == "win32"',
]

# Test-only deps, kept out of `dependencies` (and requirements.txt) so a runtime install stays lean.
# The backend runs from source rather than as an installed package, so install via the mirror file:
# `pip install -r requirements-test.txt`. pytest runs the suite; httpx2 backs FastAPI's TestClient
# (see backend/tests/_api_client.py).
[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "httpx2==2.13.1",
]
# Linting only, kept out of `test` on purpose: a CI job that installs the test extra to run pytest
# should not drag a linter in as a side effect, and the two are gated separately.
dev = [
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow, chosen from a measured first run rather than a preset.
#
# `F` is the half that behaves like a compiler for a language that does not have one: an undefined
# name, a redefinition that silently discards the first definition, a comparison that cannot be true.
# Those are runtime errors here, and only in whichever branch a test happens not to cover. It is
# already clean of all of them, which is what makes it a gate rather than a cleanup project.
#
# `DTZ003`/`DTZ005` are the general form of scripts/check-backend-timestamps.js: a stored timestamp
# must flow through time_utils.utcnow_iso() rather than a naive datetime. The rest of the DTZ family
# is deliberately excluded — 56 of its remaining hits are `date.today()`, and a local calendar date
# is usually the right thing in a ledger.
#
# Not selected, both measured and rejected: `E`/`W`, because 140 of their 144 hits are the deliberate
# column-aligned one-liners in routers/categories.py and enforcing them would mean reformatting
# correct code; and `I`, which is autofixable but rewrites imports across ~119 files to catch nothing.
# Run `ruff check --select I --fix` by hand if import ordering is ever worth its own pass.
select = ["F", "DTZ003", "DTZ005"]

# Only consulted by an explicit `--select I` run, since `I` is not in the selection above.
[tool.ruff.lint.isort]
known-first-party = ["backend"]
