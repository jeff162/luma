<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Luma icon</title>
  <desc id="desc">A dark blue L combined with three ascending teal bars.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#405b82"/>
      <stop offset="0.55" stop-color="#182f50"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <linearGradient id="teal1" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#35d6cc"/>
      <stop offset="1" stop-color="#0a9fa8"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#35d6cc"/>
      <stop offset="1" stop-color="#079aa6"/>
    </linearGradient>
    <linearGradient id="teal3" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#32d4ca"/>
      <stop offset="1" stop-color="#07889e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071a2f" flood-opacity="0.22"/>
    </filter>
    <filter id="bgshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="1008" height="1008" rx="190" fill="#faf9f5" filter="url(#bgshadow)"/>
  <path d="M205 218
           C205 187 230 162 261 162
           H318
           C349 162 374 187 374 218
           V747
           H495
           C526 747 551 772 551 803
           V862
           C551 893 526 918 495 918
           H261
           C230 918 205 893 205 862
           Z"
        fill="url(#navy)" filter="url(#shadow)"/>
  <rect x="571" y="710" width="87" height="208" rx="28" fill="url(#teal1)" filter="url(#shadow)"/>
  <rect x="674" y="626" width="87" height="292" rx="28" fill="url(#teal2)" filter="url(#shadow)"/>
  <rect x="777" y="499" width="129" height="419" rx="38" fill="url(#teal3)" filter="url(#shadow)"/>
</svg>
